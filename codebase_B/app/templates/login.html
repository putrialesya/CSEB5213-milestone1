{% extends "base.html" %}{% block title %}Log in{% endblock %}{% block content %}
<div class="auth-wrap"><section class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Log in to continue.</h1><p class="muted">Your next experience is only a few clicks away.</p>

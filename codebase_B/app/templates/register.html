{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}
<div class="auth-wrap"><section class="auth-card"><p class="eyebrow">JOIN THE CROWD</p><h1>Create your account.</h1><p class="muted">Save your tickets and keep your bookings together.</p>
<form method="post" class="stack"><label>Full name<input name="name" required maxlength="100" autocomplete="name"></label><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password <span class="muted small">(at least 8 characters)</span><input type="password" name="password" required minlength="8" autocomplete="new-password"></label><button class="full">Create account</button></form><p class="small muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p></section></div>{% endblock %}
